<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 42" width="170" height="42" fill="none">
  <defs>
    <linearGradient id="tradeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387ed1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#387ed1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#387ed1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Trading Glyph Mark -->
  <g transform="translate(3, 3)" filter="url(#glow)">
    <rect x="0" y="0" width="36" height="36" rx="9" fill="url(#tradeGrad)" />
    
    <!-- Rising Chart Bars -->
    <rect x="8" y="20" width="4" height="8" rx="2" fill="#ffffff" opacity="0.75" />
    <rect x="15" y="14" width="4" height="14" rx="2" fill="#ffffff" opacity="0.9" />
    <rect x="22" y="8" width="5" height="20" rx="2.5" fill="#ffffff" />
    
    <!-- Uptrend Line with Indicator -->
    <path d="M6 24 L14 16 L21 18 L28 8" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="28" cy="8" r="2.2" fill="#34d399" />
  </g>

  <!-- Brand Typography -->
  <text x="47" y="28" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#1e293b" letter-spacing="-0.5">Trade</text>
  <text x="115" y="28" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="url(#xGrad)" letter-spacing="-0.5">X</text>

  <!-- Live Pulse Dot -->
  <circle cx="136" cy="13" r="3" fill="#10b981" />
  <circle cx="136" cy="13" r="5.5" fill="#10b981" opacity="0.25" />
</svg>